name: Client checks

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-checks.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the app is developed against.
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The pre-commit hook runs these two plus `next build`. This is the copy
      # that counts for lint and types: the hook is per-machine, and
      # `--no-verify` skips it. The build is left to the deploy.
      - name: Lint
        run: npm run lint

      # `next build` typechecks as well. Kept separate so a type error is
      # reported on its own line rather than buried in build output, and so it
      # still fails if anyone sets typescript.ignoreBuildErrors.
      - name: Typecheck
        run: npx tsc --noEmit
