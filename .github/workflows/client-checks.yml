name: Client checks

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-checks.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the app is developed against.
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same three checks the pre-commit hook runs, in the same order, so a
      # green commit locally does not turn red here. This is the copy that
      # counts: the hook is per-machine and `--no-verify` skips it.
      - name: Lint
        run: npm run lint

      # `next build` typechecks as well. Kept separate so a type error is
      # reported on its own line rather than buried in build output, and so it
      # still fails if anyone sets typescript.ignoreBuildErrors.
      - name: Typecheck
        run: npx tsc --noEmit

      # No env is set: nothing here reads configuration at build time. The only
      # variables the app touches are NODE_ENV and an optional MEMBER_PROGRAM,
      # and every data route is server-rendered on demand, so the build never
      # calls the API.
      - name: Build
        run: npm run build
