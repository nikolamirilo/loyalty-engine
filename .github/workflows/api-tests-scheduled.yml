name: API tests (scheduled)

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC
    - cron: "0 13 * * *"  # 13:00 UTC
  workflow_dispatch:

jobs:
  tests:
    name: API tests
    uses: ./.github/workflows/api-tests.yml
    with:
      report_label: ${{ github.event.schedule == '0 7 * * *' && '07:00' || '13:00' }}
    secrets: inherit